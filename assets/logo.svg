    <path d="M108 74 C112 66 122 62 130 66 C133 68 134 71 133 74 L112 78 C109 77 107 76 108 74 Z" fill="#0C2230"/>
    <circle cx="128" cy="76" r="14" fill="url(#lensGrad)"/>
    <circle cx="156" cy="72" r="12" fill="url(#lensGrad)"/>
    <path d="M140 74 C144 70 150 70 154 72" stroke="#0C2230" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M114 68 C110 65 104 65 100 68" stroke="#0C2230" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="123" cy="72" r="4" fill="#AED9EA" opacity="0.7"/>
    <circle cx="151" cy="68" r="3.5" fill="#AED9EA" opacity="0.7"/>
  </g>

  <!-- feet -->
  <path d="M98 152 L94 168 M98 152 L102 170 M98 152 L108 166" stroke="#164C6B" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
